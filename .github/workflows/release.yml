name: Android Release

on:
  push:
    tags: ["v*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing product tag to rebuild and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install declared SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate product version and tag
        run: python3 scripts/prepare-release.py --check-only --tag "$RELEASE_TAG"
      - name: Restore existing test signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing persistent test signing keystore"; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass android | sha256sum | \
            grep -q '^b2b0f013dcfa428bb6f4c3563faa204c7890f72abd6062d1cbbb155222d493c9 '
      - name: Test, lint and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify and package APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/prepare-release.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/AegisVaultMobile-*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Check asset hashes
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt \
            --verify-tag --draft --title "AegisVault Mobile $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
          python3 scripts/verify-release.py --tag "$RELEASE_TAG" --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
          python3 scripts/verify-release.py --tag "$RELEASE_TAG"
