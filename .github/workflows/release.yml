name: Android Release

on:
  push:
    tags: ["v*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install declared SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate product version and tag
        run: python3 scripts/prepare-release.py --check-only --tag "$GITHUB_REF_NAME"
      - name: Restore existing test signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing persistent test signing keystore"; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Test, lint and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify and package APK
        run: python3 scripts/prepare-release.py --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/AegisVaultMobile-*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Check asset hashes
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS.txt \
            --verify-tag --draft --title "AegisVault Mobile $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          python3 scripts/verify-release.py --tag "$GITHUB_REF_NAME" --draft
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          python3 scripts/verify-release.py --tag "$GITHUB_REF_NAME"
